<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部需求列表</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover {
            color: #fff;
        }

        /* 筛选栏 */
        .filters {
            background: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
            border: 1px solid #e9edf4;
        }
        .filters input, .filters select {
            padding: 8px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #f8fafc;
            min-width: 140px;
        }
        .filters input:focus, .filters select:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .filters button {
            padding: 8px 20px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .filters button:hover {
            background: #2563eb;
        }
        .filters .sort-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .filters .sort-group label {
            font-size: 0.85rem;
            color: #475569;
        }

        /* 数据统计 */
        .stats {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .stats strong {
            color: #0f172a;
        }

        /* 需求列表 */
        .demand-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .demand-item {
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            transition: 0.2s;
            cursor: pointer;
        }
        .demand-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59,130,246,0.1);
        }
        .demand-item .title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .demand-item .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85rem;
            color: #64748b;
            align-items: center;
        }
        .demand-item .source-tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .demand-item .priority-tag {
            background: #fef3c7;
            color: #b45309;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .demand-item .desc {
            color: #475569;
            font-size: 0.9rem;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .pagination button:hover:not(:disabled) {
            background: #f1f5f9;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination .active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
        }
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .filters { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <header class="header">
        <h1>📋 全部需求列表</h1>
        <a href="/">← 返回看板</a>
    </header>

    <!-- 筛选栏 -->
    <div class="filters">
        <input type="text" id="keywordInput" placeholder="搜索标题/描述..." style="flex:1;min-width:200px;">
        <select id="sourceSelect">
            <option value="all">全部数据源</option>
        </select>
        <div class="sort-group">
            <label>排序：</label>
            <select id="sortBy">
                <option value="publish_date">发布时间</option>
                <option value="source_priority">来源优先级</option>
            </select>
            <select id="sortOrder">
                <option value="desc">↓ 降序</option>
                <option value="asc">↑ 升序</option>
            </select>
        </div>
        <button id="searchBtn">🔍 搜索</button>
        <button id="resetBtn" style="background:#e9edf4;color:#475569;">重置</button>
    </div>

    <!-- 统计 -->
    <div class="stats" id="stats">加载中...</div>

    <!-- 列表 -->
    <div class="demand-list" id="demandList">
        <div class="loading">加载中...</div>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>

</div>

<script>
    let currentPage = 1;
    const pageSize = 20;

    // 加载数据源下拉菜单
    function loadSources() {
        fetch('/api/dashboard')
            .then(r => r.json())
            .then(data => {
                if (data.all_sources) {
                    const select = document.getElementById('sourceSelect');
                    data.all_sources.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.text = s;
                        select.appendChild(opt);
                    });
                }
            })
            .catch(() => {});
    }

    // 加载需求列表
    function loadDemands(page) {
        const keyword = document.getElementById('keywordInput').value;
        const source = document.getElementById('sourceSelect').value;
        const sortBy = document.getElementById('sortBy').value;
        const sortOrder = document.getElementById('sortOrder').value;

        const url = `/api/demands?page=${page}&page_size=${pageSize}&keyword=${encodeURIComponent(keyword)}&source=${source}&sort_by=${sortBy}&sort_order=${sortOrder}`;

        document.getElementById('demandList').innerHTML = '<div class="loading">加载中...</div>';

        fetch(url)
            .then(r => r.json())
            .then(res => {
                if (res.code !== 0 || !res.data) {
                    document.getElementById('demandList').innerHTML = '<div class="empty">暂无数据</div>';
                    document.getElementById('stats').textContent = '暂无数据';
                    return;
                }

                const data = res.data;
                document.getElementById('stats').textContent = `共 ${data.total} 条需求，第 ${data.page}/${data.total_pages} 页`;

                const list = document.getElementById('demandList');
                if (data.list.length === 0) {
                    list.innerHTML = '<div class="empty">暂无匹配的需求</div>';
                    renderPagination(data);
                    return;
                }

                list.innerHTML = data.list.map(item => `
                    <div class="demand-item" onclick="location.href='/demand/${item.id}'">
                        <div class="title">${item.title}</div>
                        <div class="meta">
                            <span class="source-tag">${item.source}</span>
                            ${item.source_priority === 1 ? '<span class="priority-tag">⭐ 公众号来源</span>' : ''}
                            <span>📅 ${item.publish_date || item.created_at?.slice(0,10) || '未知'}</span>
                            ${item.category ? `<span>📂 ${item.category}</span>` : ''}
                        </div>
                        ${item.description ? `<div class="desc">${item.description}</div>` : ''}
                    </div>
                `).join('');

                renderPagination(data);
            })
            .catch(err => {
                document.getElementById('demandList').innerHTML = '<div class="empty">加载失败，请重试</div>';
                console.error(err);
            });
    }

    // 渲染分页
    function renderPagination(data) {
        const totalPages = data.total_pages || 1;
        const current = data.page || 1;
        const container = document.getElementById('pagination');

        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button ${current <= 1 ? 'disabled' : ''} onclick="loadDemands(${current - 1})">上一页</button>`;

        const start = Math.max(1, current - 2);
        const end = Math.min(totalPages, current + 2);

        if (start > 1) {
            html += `<button onclick="loadDemands(1)">1</button>`;
            if (start > 2) html += `<span style="padding:0 4px;color:#94a3b8;">...</span>`;
        }

        for (let i = start; i <= end; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="loadDemands(${i})">${i}</button>`;
        }

        if (end < totalPages) {
            if (end < totalPages - 1) html += `<span style="padding:0 4px;color:#94a3b8;">...</span>`;
            html += `<button onclick="loadDemands(${totalPages})">${totalPages}</button>`;
        }

        html += `<button ${current >= totalPages ? 'disabled' : ''} onclick="loadDemands(${current + 1})">下一页</button>`;

        container.innerHTML = html;
    }

    // 事件绑定
    document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; loadDemands(1); });
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('keywordInput').value = '';
        document.getElementById('sourceSelect').value = 'all';
        document.getElementById('sortBy').value = 'publish_date';
        document.getElementById('sortOrder').value = 'desc';
        currentPage = 1;
        loadDemands(1);
    });
    // 按回车搜索
    document.getElementById('keywordInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') { currentPage = 1; loadDemands(1); }
    });

    // 初始化
    loadSources();
    loadDemands(1);
</script>
</body>
</html>
