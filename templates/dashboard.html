<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据需求看板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px 32px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .header .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header .nav-links a:hover { color: #fff; }
        .header .update-time {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stats-card {
            background: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            text-align: center;
        }
        .stats-card .number {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-card .label {
            font-size: 0.8rem;
            color: #64748b;
        }

        /* 重点推荐区域 */
        #recommendSection {
            margin-bottom: 16px;
        }
        #recommendSection .recommend-box {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 12px;
            padding: 14px 20px;
            border-left: 4px solid #f59e0b;
        }
        #recommendSection .recommend-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        #recommendSection .recommend-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #92400e;
        }
        #recommendSection .recommend-header .sub {
            font-size: 0.8rem;
            color: #78350f;
        }
        #recommendSection .recommend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #fde68a;
            cursor: pointer;
        }
        #recommendSection .recommend-item:last-child {
            border-bottom: none;
        }
        #recommendSection .recommend-item .item-title {
            font-weight: 500;
            color: #1e293b;
        }
        #recommendSection .recommend-item .item-source {
            font-size: 0.8rem;
            color: #78350f;
            background: #fef3c7;
            padding: 0 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        #recommendSection .recommend-item:hover .item-title {
            color: #3b82f6;
        }

        .filters {
            background: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            border: 1px solid #e9edf4;
        }
        .filters input, .filters select {
            padding: 6px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #f8fafc;
        }
        .filters button {
            padding: 6px 16px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .filters button:hover { background: #2563eb; }
        .filters .btn-success {
            background: #10b981;
        }
        .filters .btn-success:hover {
            background: #059669;
        }
        .filters .btn-reset {
            background: #e9edf4;
            color: #475569;
        }
        .filters .btn-reset:hover {
            background: #d1d9e6;
        }

        .demand-item {
            background: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #e9edf4;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .demand-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59,130,246,0.1);
        }
        .demand-item .title {
            font-weight: 600;
            color: #0f172a;
            font-size: 1rem;
        }
        .demand-item .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
            align-items: center;
        }
        .demand-item .source-tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .demand-item .priority-tag {
            background: #fef3c7;
            color: #b45309;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }
        .loading, .empty {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .filters { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <header class="header">
        <h1>📋 数据需求看板</h1>
        <div class="nav-links">
            <span class="update-time" id="lastUpdate">⏱ 最后更新：加载中...</span>
            <a href="/stats">📊 统计看板</a>
        </div>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stats-card"><div class="number" id="total">-</div><div class="label">📌 总需求</div></div>
        <div class="stats-card"><div class="number" id="today">-</div><div class="label">📈 今日新增</div></div>
        <div class="stats-card"><div class="number" id="sources">-</div><div class="label">🏷️ 数据源</div></div>
        <div class="stats-card"><div class="number" id="categories">-</div><div class="label">📂 分类数</div></div>
    </div>

    <!-- 重点推荐区域 -->
    <div id="recommendSection">
        <div class="recommend-box">
            <div class="recommend-header">
                <span class="title">⭐ 重点推荐</span>
                <span class="sub">（公众号来源 · 更真实可靠）</span>
            </div>
            <div id="recommendList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filters">
        <input type="text" id="keywordInput" placeholder="搜索需求标题..." style="flex:1;min-width:180px;">
        <select id="sourceSelect"><option value="all">全部数据源</option></select>
        <button id="searchBtn">🔍 搜索</button>
        <button class="btn-reset" id="resetBtn">重置</button>
        <button class="btn-success" id="exportExcelBtn">📊 导出 Excel</button>
    </div>

    <!-- 需求列表 -->
    <div id="demandList"><div class="loading">加载中...</div></div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>

</div>

<script>
    let currentPage = 1;
    const pageSize = 15;

    function updateTimestamp() {
        document.getElementById('lastUpdate').textContent = '⏱ 最后更新：' + new Date().toLocaleString('zh-CN');
    }

    // ===== 加载来源列表（关键修复） =====
    function loadSources() {
        fetch('/api/dashboard')
            .then(r => r.json())
            .then(data => {
                if (data.all_sources && data.all_sources.length > 0) {
                    const select = document.getElementById('sourceSelect');
                    // 保留第一个"全部数据源"选项
                    select.innerHTML = '<option value="all">全部数据源</option>';
                    // 按字母顺序排序，让查找更方便
                    const sortedSources = data.all_sources.sort();
                    sortedSources.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.text = s;
                        select.appendChild(opt);
                    });
                    console.log('✅ 已加载来源列表，共 ' + sortedSources.length + ' 个来源');
                } else {
                    console.warn('⚠️ 未获取到来源列表');
                }
                // ✅ 来源加载完成后，再加载需求列表
                loadDemands(1);
            })
            .catch(err => {
                console.error('❌ 加载来源失败:', err);
                // 即使加载失败，也尝试加载需求
                loadDemands(1);
            });
    }

    // ===== 加载统计信息 =====
    function loadStats() {
        fetch('/api/dashboard')
            .then(r => r.json())
            .then(data => {
                if (data.error) return;
                document.getElementById('total').textContent = data.total || 0;
                document.getElementById('today').textContent = data.today_count || 0;
                document.getElementById('sources').textContent = Object.keys(data.source_counts || {}).length;
                document.getElementById('categories').textContent = Object.keys(data.category_counts || {}).length;
                updateTimestamp();
            })
            .catch(() => {});
    }

    // ===== 加载重点推荐 =====
    function loadRecommendations() {
        fetch('/api/demands?page=1&page_size=5&sort_by=source_priority&sort_order=asc')
            .then(r => r.json())
            .then(res => {
                const list = document.getElementById('recommendList');
                if (res.code === 0 && res.data.list.length > 0) {
                    list.innerHTML = res.data.list.map(item => `
                        <div class="recommend-item" onclick="location.href='/demand/${item.id}'">
                            <span class="item-title">${item.title}</span>
                            <span class="item-source">${item.source}</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="color:#78350f;font-size:0.9rem;">暂无重点推荐需求</div>';
                }
            })
            .catch(() => {
                document.getElementById('recommendList').innerHTML = '<div style="color:#78350f;font-size:0.9rem;">加载失败</div>';
            });
    }

    // ===== 加载需求列表 =====
    function loadDemands(page) {
        const keyword = document.getElementById('keywordInput').value;
        const source = document.getElementById('sourceSelect').value;
        const url = `/api/demands?page=${page}&page_size=${pageSize}&keyword=${encodeURIComponent(keyword)}&source=${source}&sort_by=source_priority&sort_order=asc`;

        document.getElementById('demandList').innerHTML = '<div class="loading">加载中...</div>';

        fetch(url)
            .then(r => r.json())
            .then(res => {
                if (res.code !== 0 || !res.data) {
                    document.getElementById('demandList').innerHTML = '<div class="empty">暂无数据</div>';
                    renderPagination({ total_pages: 0, page: 1 });
                    return;
                }
                const data = res.data;
                const list = document.getElementById('demandList');

                if (data.list.length === 0) {
                    list.innerHTML = '<div class="empty">暂无匹配的需求</div>';
                    renderPagination(data);
                    return;
                }

                list.innerHTML = data.list.map(item => `
                    <div class="demand-item" onclick="location.href='/demand/${item.id}'">
                        <div class="title">${item.title}</div>
                        <div class="meta">
                            <span class="source-tag">${item.source}</span>
                            ${item.source_priority === 1 ? '<span class="priority-tag">⭐ 公众号</span>' : ''}
                            <span>📅 ${item.publish_date || item.created_at?.slice(0,10) || '未知'}</span>
                            ${item.category ? `<span>📂 ${item.category}</span>` : ''}
                        </div>
                        ${item.description ? `<div style="color:#475569;font-size:0.9rem;margin-top:4px;">${item.description.slice(0,150)}${item.description.length > 150 ? '...' : ''}</div>` : ''}
                    </div>
                `).join('');

                renderPagination(data);
                // 刷新统计信息
                loadStats();
            })
            .catch(err => {
                document.getElementById('demandList').innerHTML = '<div class="empty">加载失败，请重试</div>';
                console.error(err);
            });
    }

    // ===== 渲染分页 =====
    function renderPagination(data) {
        const totalPages = data.total_pages || 1;
        const current = data.page || 1;
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }

        let html = '';
        html += `<button ${current <= 1 ? 'disabled' : ''} onclick="loadDemands(${current-1})">上一页</button>`;
        const start = Math.max(1, current-2);
        const end = Math.min(totalPages, current+2);
        if (start > 1) { html += `<button onclick="loadDemands(1)">1</button>`; if (start>2) html += `<span>...</span>`; }
        for (let i=start; i<=end; i++) {
            html += `<button class="${i===current?'active':''}" onclick="loadDemands(${i})">${i}</button>`;
        }
        if (end < totalPages) { if (end < totalPages-1) html += `<span>...</span>`; html += `<button onclick="loadDemands(${totalPages})">${totalPages}</button>`; }
        html += `<button ${current>=totalPages?'disabled':''} onclick="loadDemands(${current+1})">下一页</button>`;
        container.innerHTML = html;
    }

    // ===== 导出 Excel =====
    function exportExcel() {
        const keyword = document.getElementById('keywordInput').value;
        const source = document.getElementById('sourceSelect').value;
        // 构建导出URL，包含当前筛选条件
        let url = '/api/export_excel?';
        if (keyword) url += `keyword=${encodeURIComponent(keyword)}&`;
        if (source !== 'all') url += `source=${encodeURIComponent(source)}&`;
        window.open(url, '_blank');
    }

    // ===== 绑定事件 =====
    document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; loadDemands(1); });
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('keywordInput').value = '';
        document.getElementById('sourceSelect').value = 'all';
        currentPage = 1;
        loadDemands(1);
    });
    document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
    document.getElementById('keywordInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') { currentPage = 1; loadDemands(1); }
    });

    // ============================================================
    // ✅ 修改后的初始化：先加载来源，再加载需求
    // ============================================================
    // 先加载统计和推荐（不依赖来源列表）
    loadStats();
    loadRecommendations();
    // 加载来源（内部会调用 loadDemands(1)）
    loadSources();
    // 每5分钟刷新统计
    setInterval(loadStats, 300000);
</script>
</body>
</html>
