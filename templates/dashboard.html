<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据需求看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 1440px;
            width: 100%;
        }

        /* ----- 头部 ----- */
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 24px 32px;
            border-radius: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.25);
        }
        .header h1 {
            color: #fff;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 span {
            background: rgba(255,255,255,0.12);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #94a3b8;
        }
        .header .update-time {
            color: #94a3b8;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.06);
            padding: 6px 16px;
            border-radius: 40px;
        }

        /* ----- 筛选栏 ----- */
        .filters {
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: flex-end;
            border: 1px solid #e9edf4;
        }
        .filters label {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            font-weight: 500;
            color: #475569;
            gap: 4px;
        }
        .filters input, .filters select {
            padding: 8px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #f8fafc;
            transition: 0.2s;
            min-width: 140px;
        }
        .filters input:focus, .filters select:focus {
            border-color: #3b82f6;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .filters .btn-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
            align-items: center;
        }
        .filters button {
            padding: 8px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        /* ----- 卡片 ----- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .card {
            background: #ffffff;
            padding: 20px 18px 16px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #e9edf4;
            transition: 0.25s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.07);
            border-color: #cbd5e1;
        }
        .card h3 {
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .card .number .unit {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 4px;
        }

        /* ----- 图表容器 ----- */
        .chart-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-box {
            flex: 1 1 calc(50% - 20px);
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 20px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #e9edf4;
            transition: 0.2s;
            min-width: 280px;
        }
        .chart-box:hover {
            border-color: #cbd5e1;
        }
        .chart-box h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }
        .chart-container {
            width: 100%;
            height: 280px;
        }
        .full-width {
            flex: 1 1 100%;
        }

        /* ----- 今日新增列表 ----- */
        .today-list {
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 16px;
            border: 1px solid #e9edf4;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            margin-top: 8px;
        }
        .today-list h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .today-list ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 260px;
            overflow-y: auto;
        }
        .today-list li {
            padding: 8px 4px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            color: #1e293b;
        }
        .today-list li:last-child { border-bottom: none; }
        .today-list .source-tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .today-list .empty {
            color: #94a3b8;
            font-style: italic;
            padding: 16px 0;
        }

        /* ----- 页脚 ----- */
        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 20px 0 8px;
            border-top: 1px solid #e9edf4;
            margin-top: 30px;
        }

        /* ----- 响应式 ----- */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 18px 20px;
            }
            .header h1 { font-size: 1.4rem; }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters .btn-group {
                margin-left: 0;
                justify-content: flex-end;
            }
            .chart-box {
                flex: 1 1 100%;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- 头部 -->
    <header class="header">
        <h1>
            📊 数据需求看板
            <span>实时监控</span>
        </h1>
        <div class="update-time" id="lastUpdate">⏱ 最后更新：加载中...</div>
    </header>

    <!-- 筛选栏 -->
    <div class="filters">
        <label>开始日期 <input type="date" id="startDate"></label>
        <label>结束日期 <input type="date" id="endDate"></label>
        <label>数据源 <select id="sourceSelect"><option value="all">全部</option></select></label>
        <div class="btn-group">
            <button class="btn-primary" id="applyFilter">🔍 应用筛选</button>
            <button class="btn-success" id="exportBtn">⬇ 导出 CSV</button>
        </div>
    </div>

    <!-- 总览卡片 -->
    <div class="cards">
        <div class="card"><h3>📌 总需求</h3><div class="number" id="total">-</div></div>
        <div class="card"><h3>📈 今日新增</h3><div class="number" id="today">-</div></div>
        <div class="card"><h3>🏷️ 数据源</h3><div class="number" id="sources">-</div></div>
        <div class="card"><h3>📂 分类数</h3><div class="number" id="categories">-</div></div>
    </div>

    <!-- 图表行1 -->
    <div class="chart-row">
        <div class="chart-box"><h3>📈 每日新增趋势（近30天）</h3><div class="chart-container" id="trendChart"></div></div>
        <div class="chart-box"><h3>🧩 来源分布</h3><div class="chart-container" id="sourceChart"></div></div>
    </div>

    <!-- 图表行2 -->
    <div class="chart-row">
        <div class="chart-box"><h3>📊 近7日新增</h3><div class="chart-container" id="weekChart"></div></div>
        <div class="chart-box"><h3>📂 分类分布</h3><div class="chart-container" id="categoryChart"></div></div>
    </div>

    <!-- 图表行3 -->
    <div class="chart-row">
        <div class="chart-box full-width"><h3>📈 各平台每日趋势（近30天）</h3><div class="chart-container" id="platformTrendChart"></div></div>
    </div>

    <!-- 今日新增列表 -->
    <div class="today-list">
        <h3>🆕 今日新增需求（前20条）</h3>
        <ul id="todayItems"><li class="empty">加载中...</li></ul>
    </div>

    <footer class="footer">
        © 2026 数据需求采集系统 · 数据源：尚数网 / 北京 / 上海 / 广州
    </footer>
</div>

<script>
    let currentCharts = [];

    function updateTimestamp() {
        const now = new Date();
        document.getElementById('lastUpdate').textContent = '⏱ 最后更新：' + now.toLocaleString('zh-CN');
    }

    function fetchData() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const source = document.getElementById('sourceSelect').value;
        const url = `/api/dashboard?start_date=${start}&end_date=${end}&source=${source}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.warn('无数据');
                    return;
                }
                // 更新卡片
                document.getElementById('total').innerText = data.total;
                document.getElementById('today').innerText = data.today_count;
                document.getElementById('sources').innerText = Object.keys(data.source_counts).length;
                document.getElementById('categories').innerText = Object.keys(data.category_counts).length;

                // 每次刷新时重新构建下拉菜单（保留“全部”选项）
                if (data.all_sources) {
                    const select = document.getElementById('sourceSelect');
                    select.innerHTML = '<option value="all">全部</option>';
                    data.all_sources.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.text = s;
                        select.appendChild(opt);
                    });
                    if (data.current_source && data.current_source !== 'all') {
                        select.value = data.current_source;
                    }
                }

                // 今日列表
                const list = document.getElementById('todayItems');
                list.innerHTML = '';
                if (data.today_list && data.today_list.length > 0) {
                    data.today_list.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${item.title}</span><span class="source-tag">${item.source}</span>`;
                        list.appendChild(li);
                    });
                } else {
                    list.innerHTML = '<li class="empty">今日暂无新增需求</li>';
                }

                renderCharts(data);
                updateTimestamp();
            })
            .catch(err => console.error('数据加载失败:', err));
    }

    function renderCharts(data) {
        // 销毁旧图表
        if (currentCharts.length) {
            currentCharts.forEach(c => c.dispose());
            currentCharts = [];
        }

        // 颜色调色板（科技蓝紫系列）
        const colorPalette = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'];

        // 1. 趋势图
        const trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: data.dates, axisLine: { lineStyle: { color: '#e2e8f0' } } },
            yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
            series: [{
                name: '新增需求',
                type: 'line',
                smooth: true,
                data: data.dates.map(d => data.daily_data[d] || 0),
                areaStyle: { opacity: 0.2, color: '#3b82f6' },
                lineStyle: { color: '#3b82f6', width: 2 },
                itemStyle: { color: '#3b82f6' }
            }]
        });
        currentCharts.push(trendChart);

        // 2. 来源分布
        const sourceChart = echarts.init(document.getElementById('sourceChart'));
        const sourceNames = Object.keys(data.source_counts);
        const sourceValues = Object.values(data.source_counts);
        sourceChart.setOption({
            tooltip: { trigger: 'item' },
            color: colorPalette,
            series: [{
                type: 'pie',
                radius: ['45%', '70%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                label: { formatter: '{b}\n({d}%)', fontSize: 11 },
                data: sourceNames.map((name, i) => ({ name, value: sourceValues[i] }))
            }]
        });
        currentCharts.push(sourceChart);

        // 3. 近7日
        const weekChart = echarts.init(document.getElementById('weekChart'));
        weekChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: data.last_7_dates, axisLine: { lineStyle: { color: '#e2e8f0' } } },
            yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
            series: [{
                type: 'bar',
                data: data.last_7_dates.map(d => data.last_7_data[d] || 0),
                itemStyle: { color: '#8b5cf6', borderRadius: [6,6,0,0] }
            }]
        });
        currentCharts.push(weekChart);

        // 4. 分类分布
        const categoryChart = echarts.init(document.getElementById('categoryChart'));
        const catNames = Object.keys(data.category_counts);
        const catValues = Object.values(data.category_counts);
        categoryChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: catNames, axisLine: { lineStyle: { color: '#e2e8f0' } } },
            yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
            series: [{
                type: 'bar',
                data: catValues,
                itemStyle: { color: '#10b981', borderRadius: [6,6,0,0] }
            }]
        });
        currentCharts.push(categoryChart);

        // 5. 各平台趋势
        const platformChart = echarts.init(document.getElementById('platformTrendChart'));
        const platformNames = Object.keys(data.platform_daily);
        const series = platformNames.map((name, idx) => ({
            name: name,
            type: 'line',
            smooth: true,
            data: data.dates.map(d => data.platform_daily[name][d] || 0),
            lineStyle: { width: 2 },
            symbolSize: 4
        }));
        platformChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: platformNames, bottom: 0, icon: 'circle', itemWidth: 8 },
            color: colorPalette,
            xAxis: { type: 'category', data: data.dates, axisLine: { lineStyle: { color: '#e2e8f0' } } },
            yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
            series: series
        });
        currentCharts.push(platformChart);

        // 自适应
        window.addEventListener('resize', () => {
            currentCharts.forEach(c => c.resize());
        });
    }

    function exportCSV() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const source = document.getElementById('sourceSelect').value;
        window.open(`/api/export?start_date=${start}&end_date=${end}&source=${source}`, '_blank');
    }

    // 绑定事件
    document.getElementById('applyFilter').addEventListener('click', fetchData);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);

    // 初始化日期（最近30天）
    window.onload = function() {
        const today = new Date();
        const thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(today.getDate() - 30);
        document.getElementById('startDate').value = thirtyDaysAgo.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        fetchData();
    };

    // 每5分钟自动刷新
    setInterval(fetchData, 300000);
</script>
</body>
</html>
