<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header a:hover {
            color: #fff;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stats-card {
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            text-align: center;
        }
        .stats-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-card .label {
            font-size: 0.85rem;
            color: #64748b;
        }

        .chart-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-box {
            flex: 1 1 calc(50% - 20px);
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9edf4;
            min-width: 280px;
        }
        .chart-box h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }
        .chart-container {
            width: 100%;
            height: 280px;
        }
        .full-width {
            flex: 1 1 100%;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .chart-box { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <header class="header">
        <h1>📊 数据统计看板</h1>
        <a href="/">← 返回需求列表</a>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-cards" id="statsCards">
        <div class="stats-card"><div class="number" id="totalDemands">-</div><div class="label">总需求</div></div>
        <div class="stats-card"><div class="number" id="todayDemands">-</div><div class="label">今日新增</div></div>
        <div class="stats-card"><div class="number" id="sourceCount">-</div><div class="label">数据源</div></div>
        <div class="stats-card"><div class="number" id="categoryCount">-</div><div class="label">分类数</div></div>
    </div>

    <!-- 图表 -->
    <div class="chart-row">
        <div class="chart-box"><h3>📈 每日新增趋势（近30天）</h3><div class="chart-container" id="trendChart"></div></div>
        <div class="chart-box"><h3>🧩 来源分布</h3><div class="chart-container" id="sourceChart"></div></div>
    </div>
    <div class="chart-row">
        <div class="chart-box"><h3>📊 近7日新增</h3><div class="chart-container" id="weekChart"></div></div>
        <div class="chart-box"><h3>📂 分类分布</h3><div class="chart-container" id="categoryChart"></div></div>
    </div>
    <div class="chart-row">
        <div class="chart-box full-width"><h3>📈 各平台每日趋势（近30天）</h3><div class="chart-container" id="platformTrendChart"></div></div>
    </div>

</div>

<script>
    let charts = [];

    function fetchStats() {
        fetch('/api/dashboard?start_date=2023-01-01')
            .then(r => r.json())
            .then(data => {
                if (data.error) return;

                document.getElementById('totalDemands').textContent = data.total || 0;
                document.getElementById('todayDemands').textContent = data.today_count || 0;
                document.getElementById('sourceCount').textContent = Object.keys(data.source_counts || {}).length;
                document.getElementById('categoryCount').textContent = Object.keys(data.category_counts || {}).length;

                renderCharts(data);
            })
            .catch(err => console.error(err));
    }

    function renderCharts(data) {
        charts.forEach(c => c.dispose());
        charts = [];

        const colorPalette = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'];

        // 1. 趋势图
        const trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: data.dates || [] },
            yAxis: { type: 'value' },
            series: [{
                name: '新增需求',
                type: 'line',
                smooth: true,
                data: (data.dates || []).map(d => data.daily_data?.[d] || 0),
                areaStyle: { opacity: 0.2 }
            }]
        });
        charts.push(trendChart);

        // 2. 来源分布
        const sourceChart = echarts.init(document.getElementById('sourceChart'));
        const sourceNames = Object.keys(data.source_counts || {});
        const sourceValues = Object.values(data.source_counts || {});
        sourceChart.setOption({
            tooltip: { trigger: 'item' },
            color: colorPalette,
            series: [{
                type: 'pie',
                radius: ['45%', '70%'],
                label: { formatter: '{b}\n({d}%)', fontSize: 11 },
                data: sourceNames.map((name, i) => ({ name, value: sourceValues[i] }))
            }]
        });
        charts.push(sourceChart);

        // 3. 近7日
        const weekChart = echarts.init(document.getElementById('weekChart'));
        weekChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: data.last_7_dates || [] },
            yAxis: { type: 'value' },
            series: [{
                type: 'bar',
                data: (data.last_7_dates || []).map(d => data.last_7_data?.[d] || 0),
                itemStyle: { color: '#8b5cf6', borderRadius: [6,6,0,0] }
            }]
        });
        charts.push(weekChart);

        // 4. 分类分布
        const categoryChart = echarts.init(document.getElementById('categoryChart'));
        const catNames = Object.keys(data.category_counts || {});
        const catValues = Object.values(data.category_counts || {});
        categoryChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: catNames },
            yAxis: { type: 'value' },
            series: [{
                type: 'bar',
                data: catValues,
                itemStyle: { color: '#10b981', borderRadius: [6,6,0,0] }
            }]
        });
        charts.push(categoryChart);

        // 5. 各平台趋势
        const platformChart = echarts.init(document.getElementById('platformTrendChart'));
        const platformNames = Object.keys(data.platform_daily || {});
        const series = platformNames.map(name => ({
            name: name,
            type: 'line',
            smooth: true,
            data: (data.dates || []).map(d => data.platform_daily?.[name]?.[d] || 0)
        }));
        platformChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: platformNames, bottom: 0 },
            color: colorPalette,
            xAxis: { type: 'category', data: data.dates || [] },
            yAxis: { type: 'value' },
            series: series
        });
        charts.push(platformChart);

        window.addEventListener('resize', () => charts.forEach(c => c.resize()));
    }

    fetchStats();
    setInterval(fetchStats, 300000);
</script>
</body>
</html>
